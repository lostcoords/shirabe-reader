<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../content.css" />
    <link rel="stylesheet" href="reader.css" />
    <title>Shirabe Reader</title>
  </head>
  <body>
    <header>
      <strong>Shirabe Reader</strong>
      <button id="pasteMode">Paste text</button>
      <label class="file">Open PDF<input id="pdfFile" type="file" accept="application/pdf" /></label>
      <button id="reflowPdf" hidden>Reflow text</button>
      <button id="faithfulPdf" hidden>Faithful PDF</button>
      <select id="fontFamily" aria-label="Japanese font"><option value="serif">Mincho</option><option value="sans">Gothic</option><option value="system">System</option></select>
      <select id="fontWeight" aria-label="Font weight"><option value="400">Regular</option><option value="500">Medium</option><option value="700">Bold</option></select>
      <label>Size <input id="fontSize" type="range" min="16" max="40" value="22" /></label>
      <label>Line <input id="lineHeight" type="range" min="14" max="24" value="18" /></label>
      <label>Width <input id="readingWidth" type="range" min="30" max="80" value="55" /></label>
      <select id="direction" aria-label="Writing direction"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select>
      <select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </header>
    <main>
      <section id="editor" hidden><textarea id="pasteText" lang="ja" placeholder="Paste Japanese text here"></textarea><button id="renderPaste">Read</button></section>
      <article id="document" lang="ja"></article>
      <iframe id="pdfFrame" title="PDF faithful view; lookup is available in Reflow text mode" hidden></iframe>
      <p id="progress" role="status"></p>
    </main>
    <script src="reader.js"></script>
  </body>
</html>
